services:
  gameprototype:
    image: nvcr.io/nvidia/pytorch:26.07-py3
    container_name: gameprototype
    stdin_open: true
    tty: true
    ipc: host
    volumes:
      - ~/git/gameprototype:/workspace/gameprototype
      - ~/git/gameprototype/cache:/root/.cache
      # vLLM-Server aus dem Spiel heraus steuern (llm.VLLM.load)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      VLLM_URL: http://vllm:8000   # wird von models.py/llm.py gelesen
      # Ollama laeuft auf dem Host - nur via host-gateway erreichbar
      # (Voraussetzung: OLLAMA_HOST=0.0.0.0 ollama serve auf dem Host).
      OLLAMA_URL: http://host.docker.internal:11434
      # Sprach- UND Bildmodelle liegen im selben HF-Cache (/root/.cache);
      # models.py findet ihn ohne weitere Konfiguration.

      # Kontextfenster. Bedarf liegt bei ~30k (System-Prompt + 12 Zuege +
      # Antwort); 65536 ist Reserve. Mit --kv-cache-dtype fp8 (unten) kostet
      # der groessere Cache kaum Speicher. Wirkt auf vLLM und Ollama.
      AIGAME_NUM_CTX: 65536
      # Antwortlaenge. Im Thinking-Modus muessen Denkprozess UND das
      # vollstaendige Szenen-JSON hineinpassen - mit 2048/4096 wurde das JSON
      # nach dem Denken abgeschnitten. Betrifft nur vLLM, nicht Ollama.
      AIGAME_MAX_TOKENS: 8192
      # Anteil des gemeinsamen Speichers fuer vLLM (Gewichte + KV-Cache).
      # 0.78 von 128 GB sind rund 100 GB; der Rest bleibt fuers Bildmodell,
      # das danach geladen wird. Hochsetzen, wenn vLLM beim KV-Cache
      # abbricht - runter, wenn danach FLUX nicht mehr passt.
      AIGAME_VLLM_GPU_UTIL: "0.78"
      # Zusaetzliche Flags fuer 'vllm serve' - Durchsatz-Tuning aus der
      # DGX-Spark-Arena fuer Qwen3.6-35B-A3B-NVFP4 (hoechste Token-Rate):
      #   --enable-prefix-caching   spart den Prefill des ~6500-Token-
      #                             System-Prompts in JEDER Runde
      #   --async-scheduling        Scheduling parallel zur GPU-Rechnung
      #   --enable-chunked-prefill  lange Prefills stueckeln, Decode stockt nicht
      #   --kv-cache-dtype fp8      halbiert den KV-Cache pro Token
      #   --attention-backend flashinfer  schnellere Attention auf Blackwell
      #   --moe-backend marlin      NVFP4-optimierter MoE-Pfad (Paarung mit
      #                             VLLM_MARLIN_USE_ATOMIC_ADD im vllm-Service)
      #   --max-num-seqs 4          wir bedienen genau einen Spieler
      #   --speculative-config ...  MTP-Speculative-Decoding, groesster Hebel
      # --reasoning-parser qwen3 setzt der Code separat (llm.VLLM._serve).
      # Weigert sich vLLM zu starten ("unrecognized arguments"), kennt diese
      # Version ein Flag nicht -> das Flag hier entfernen. Die Ursache steht
      # sofort in der Fehlermeldung des Spiels.
      # Das JSON MUSS in einfachen Anfuehrungszeichen stehen, sonst frisst
      # shlex.split() in llm.py die doppelten.
      AIGAME_VLLM_ARGS: >-
        --enable-prefix-caching
        --async-scheduling
        --enable-chunked-prefill
        --kv-cache-dtype fp8
        --attention-backend flashinfer
        --moe-backend marlin
        --max-num-seqs 4
        --speculative-config '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      # Denkprozess vor der Antwort. Wirkt auf beide Backends: Ollama ueber
      # das "think"-Feld, vLLM ueber chat_template_kwargs.enable_thinking.
      # Bei vLLM trennt --reasoning-parser qwen3 (llm.VLLM._serve) den
      # Denkprozess ab, die JSON-Grammatik (response_format) bleibt dabei an.
      AIGAME_THINK: "1"
      TERM: ${TERM:-xterm-256color}
      TERM_PROGRAM: ${TERM_PROGRAM:-}
      KITTY_WINDOW_ID: ${KITTY_WINDOW_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace/gameprototype
    # Umbrueche NUR nach && / || setzen - YAML '>' haelt tiefer eingerueckte
    # Zeilen literal, und bash verlangt die Operatoren am Zeilenende.
    command: >
      bash -c "pip install 'diffusers>=0.36' transformers accelerate safetensors pillow docker &&
        sleep infinity
        "
    depends_on:
      - vllm          # nur gestartet, nicht 'healthy' - der Server wird erst vom Spiel beladen
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm:
    image: ghcr.io/timothystewart6/vllm-gb10:latest
    container_name: vllm
    ipc: host
    # PID 1 waere sonst 'sleep infinity' - und sleep erntet keine Waisen.
    # llm.VLLM._pkill() schiesst 'vllm serve' ab, dessen python3-EngineCore-
    # Worker werden dann an PID 1 umgehaengt und bleiben mangels wait() fuer
    # immer als <defunct>/Z stehen (ein Slot-Leck pro Unload). 'init: true'
    # schiebt Dockers tini als PID 1 davor, das genau diese Waisen abraeumt.
    init: true
    volumes:
      # gleicher Cache wie das Spiel: jedes gelistete Modell ist servierbar,
      # ohne dass vLLM es aus dem Netz zieht
      - ~/git/gameprototype/cache:/root/.cache
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # Paarung mit '--moe-backend marlin' (AIGAME_VLLM_ARGS): schnellere
      # Reduktion im NVFP4-MoE-Kernel.
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    # laeuft idle; llm.VLLM.load() startet 'vllm serve <modell>' per exec
    command: ["sleep", "infinity"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

