services:
  gameprototype:
    # Die Pakete stecken jetzt IM IMAGE statt in einem pip-Aufruf beim
    # Containerstart. Frueher wurden sie bei jedem Start neu installiert -
    # nach einem 'compose down' war die Schreibschicht weg, und wer sich in
    # den ersten ~30 Sekunden einklinkte, fand z.B. 'docker' noch nicht vor.
    #
    # dockerfile_inline haelt alles in dieser einen Datei; ein separates
    # Dockerfile waere sonst noetig. Gebaut wird beim ersten 'compose up',
    # danach kommt das fertige Image aus dem Cache und der Container ist in
    # Sekunden da. Neu bauen mit:  docker compose build
    build:
      context: .
      dockerfile_inline: |
        FROM nvcr.io/nvidia/pytorch:26.07-py3
        # --no-cache-dir: der pip-Cache wuerde das Image nur aufblaehen und
        # laeuft hier ohnehin ins Leere (der Ordner ist zur Bauzeit nicht
        # gemountet).
        RUN pip install --no-cache-dir \
              'diffusers>=0.36' transformers accelerate safetensors pillow \
              docker 'pydantic>=2.7'
    # Name fuer das gebaute Image - ohne diese Zeile vergibt compose einen
    # generierten Namen.
    image: aigame-gameprototype
    container_name: gameprototype
    stdin_open: true
    tty: true
    ipc: host
    volumes:
      - ~/git/gameprototype:/workspace/gameprototype
      - ~/git/gameprototype/cache:/root/.cache
      # vLLM-Server aus dem Spiel heraus steuern (llm.VLLM.load)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      VLLM_URL: http://vllm:8000   # wird von models.py/llm.py gelesen
      # Ollama laeuft auf dem Host - nur via host-gateway erreichbar
      # (Voraussetzung: OLLAMA_HOST=0.0.0.0 ollama serve auf dem Host).
      OLLAMA_URL: http://host.docker.internal:11434
      # Sprach- UND Bildmodelle liegen im selben HF-Cache (/root/.cache);
      # models.py findet ihn ohne weitere Konfiguration.

      # Kontextfenster. ~6500 System-Prompt + 12 Zuege Verlauf + Antwort
      # sprengen die frueheren 24576 gegen Ende einer Geschichte.
      AIGAME_NUM_CTX: 40960
      # Antwortlaenge. Im Thinking-Modus muessen Denkprozess UND das
      # vollstaendige Szenen-JSON hineinpassen - mit 2048 wurde das JSON
      # abgeschnitten. Betrifft nur vLLM, nicht Ollama.
      AIGAME_MAX_TOKENS: 4096
      # Anteil des gemeinsamen Speichers fuer vLLM (Gewichte + KV-Cache).
      # 0.78 von 128 GB sind rund 100 GB; der Rest bleibt fuers Bildmodell,
      # das danach geladen wird. Hochsetzen, wenn vLLM beim KV-Cache
      # abbricht - runter, wenn danach FLUX nicht mehr passt.
      AIGAME_VLLM_GPU_UTIL: "0.78"
      # Zusaetzliche Flags fuer 'vllm serve'. Prefix-Caching spart den
      # Prefill des ~6500-Token-System-Prompts in JEDER Runde.
      # Weigert sich vLLM zu starten ("unrecognized arguments"), kennt diese
      # Version das Flag nicht -> hier auf "" setzen. Die Ursache steht dann
      # sofort in der Fehlermeldung des Spiels.
      AIGAME_VLLM_ARGS: "--enable-prefix-caching"
      # Reasoning-Parser von vLLM, passend zum Modell setzen (qwen3,
      # deepseek_r1, ...). Leer lassen, wenn ohne Thinking gefahren wird.
      #
      # Zwingend, sobald AIGAME_THINK=1 UND eine Grammatik aktiv ist: ohne
      # den Parser greift die Grammatik ab dem ersten Token, das Modell
      # muesste also sofort mit "{" beginnen - ein <think>-Block waere damit
      # unmoeglich und der Denkprozess verschwaende ersatzlos. Mit dem
      # Parser denkt es frei und wird erst nach </think> gezwungen.
      AIGAME_REASONING_PARSER: "qwen3"
      AIGAME_THINK: "1"
      TERM: ${TERM:-xterm-256color}
      TERM_PROGRAM: ${TERM_PROGRAM:-}
      KITTY_WINDOW_ID: ${KITTY_WINDOW_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace/gameprototype
    # Nur noch warten - die Pakete bringt das Image schon mit (siehe build:
    # oben). Das Spiel selbst startet man per:
    #   docker exec -it -e TERM=$TERM gameprototype python3 main.py
    command: ["sleep", "infinity"]
    depends_on:
      - vllm          # nur gestartet, nicht 'healthy' - der Server wird erst vom Spiel beladen
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm:
    image: ghcr.io/timothystewart6/vllm-gb10:latest
    container_name: vllm
    ipc: host
    volumes:
      # gleicher Cache wie das Spiel: jedes gelistete Modell ist servierbar,
      # ohne dass vLLM es aus dem Netz zieht
      - ~/git/gameprototype/cache:/root/.cache
    environment:
      - HF_TOKEN=${HF_TOKEN}
    # laeuft idle; llm.VLLM.load() startet 'vllm serve <modell>' per exec
    command: ["sleep", "infinity"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

