services:
  gameprototype:
    # Die Pakete stecken jetzt IM IMAGE statt in einem pip-Aufruf beim
    # Containerstart. Frueher wurden sie bei jedem Start neu installiert -
    # nach einem 'compose down' war die Schreibschicht weg, und wer sich in
    # den ersten ~30 Sekunden einklinkte, fand z.B. 'docker' noch nicht vor.
    #
    # dockerfile_inline haelt alles in dieser einen Datei; ein separates
    # Dockerfile waere sonst noetig. Gebaut wird beim ersten 'compose up',
    # danach kommt das fertige Image aus dem Cache und der Container ist in
    # Sekunden da. Neu bauen mit:  docker compose build
    build:
      context: .
      dockerfile_inline: |
        FROM nvcr.io/nvidia/pytorch:26.07-py3
        # --no-cache-dir: der pip-Cache wuerde das Image nur aufblaehen und
        # laeuft hier ohnehin ins Leere (der Ordner ist zur Bauzeit nicht
        # gemountet).
        RUN pip install --no-cache-dir \
              'diffusers>=0.36' transformers accelerate safetensors pillow \
              docker 'pydantic>=2.7'
    # Name fuer das gebaute Image - ohne diese Zeile vergibt compose einen
    # generierten Namen.
    image: aigame-gameprototype
    container_name: gameprototype
    stdin_open: true
    tty: true
    ipc: host
    volumes:
      - ~/git/gameprototype:/workspace/gameprototype
      # HF-Modelle liegen ausserhalb des Repos (verschoben aus dem alten
      # ~/git/gameprototype/cache). Mounted nach /root/.cache/huggingface,
      # damit models.py sie wie gewohnt unter .../hub findet.
      - /srv/ai/models/huggingface:/root/.cache/huggingface
      # vLLM-Server aus dem Spiel heraus steuern (llm.VLLM.load)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      VLLM_URL: http://vllm:8000   # wird von models.py/llm.py gelesen
      # Ollama laeuft auf dem Host - nur via host-gateway erreichbar
      # (Voraussetzung: OLLAMA_HOST=0.0.0.0 ollama serve auf dem Host).
      OLLAMA_URL: http://host.docker.internal:11434
      # Sprach- UND Bildmodelle liegen im selben HF-Cache
      # (/root/.cache/huggingface); models.py findet ihn ohne weitere
      # Konfiguration.

      # Kontextfenster. Ein Aufruf ist stateless (System-Prompt + gerenderter
      # Weltzustand, kein Chatverlauf) - real ~3-4k Tokens Prompt. 65536 ist
      # trotzdem grosszuegig gewaehlt: mit --kv-cache-dtype fp8 ist der Platz
      # praktisch geschenkt, die KV-Cache-Auslastung lag im Log bei <1 %.
      AIGAME_NUM_CTX: 65536
      # Antwortlaenge (nur vLLM). Im Thinking-Modus muessen Denkprozess UND
      # Szenen-JSON hineinpassen. Reisst es davor ab (finish_reason=length),
      # ist der content leer - "vLLM returned an empty response". Der Grund
      # ist aber meist ein Denkprozess, der sich verrennt, nicht zu wenig
      # Budget: dagegen helfen AIGAME_TEMPERATURE und der Retry in
      # structured(), nicht ein groesseres Limit. 24576 ist die Grenze fuer
      # einen ehrlich langen Denkprozess.
      AIGAME_MAX_TOKENS: 24576
      # Sampling-Temperatur fuer beide Backends. 0.9 war fuer die Erzaehlung
      # bewusst kreativ - im Thinking-Modus aber zu hoch: der Denkprozess
      # terminiert dann schlechter und verrennt sich bis MAX_TOKENS. 0.6 ist
      # Qwens Empfehlung fuer den Thinking-Modus.
      AIGAME_TEMPERATURE: "0.6"
      # Presence-Penalty (nur vLLM): Qwens explizites Gegenmittel gegen
      # endlose Wiederholungen im Denkprozess - genau der Fehlerfall, bei dem
      # sich das Denken in "Let's go with X... or Y... actually Z..." im
      # Kreis dreht, bis MAX_TOKENS reisst und "vLLM returned an empty
      # response (finish_reason=length)" kommt. 1.5 ist Qwens Vorschlag bei
      # sichtbaren Schleifen. Deutlich hoeher -> Sprachmischung. 0 = aus.
      AIGAME_PRESENCE_PENALTY: "1.5"
      # Bis zu wie viele Figuren pro Runde einen eigenen DECIDE/RESOLVE-Zug
      # bekommen (state.MAX_AGENTIC). Die ersten so vielen eingefuehrten
      # Figuren werden agentisch; ein toter Agent gibt seinen Slot frei.
      AIGAME_MAX_AGENTIC: "4"
      # Wie viele der DECIDE-Aufrufe einer Runde gleichzeitig gegen vLLM
      # laufen (story.LLM_CONCURRENCY). NICHT hoeher als --max-num-seqs in
      # AIGAME_VLLM_ARGS setzen (unten, dort 4), sonst stauen sich die
      # Requests statt zu batchen. Bei AIGAME_MAX_AGENTIC > 4 auch
      # --max-num-seqs entsprechend anheben.
      AIGAME_LLM_CONCURRENCY: "4"
      # Anteil des gemeinsamen Speichers fuer vLLM (Gewichte + KV-Cache).
      # 0.65 von 128 GB sind rund 83 GB (Wert aus dem Arena-Rezept); der
      # grosszuegige Rest bleibt fuers Bildmodell, das danach geladen wird.
      # Mit --kv-cache-dtype fp8 (AIGAME_VLLM_ARGS) reicht das kleinere
      # Budget locker. Hochsetzen, wenn vLLM beim KV-Cache abbricht - runter,
      # wenn danach FLUX nicht mehr passt.
      AIGAME_VLLM_GPU_UTIL: "0.65"
      # Zusaetzliche Flags fuer 'vllm serve' - Durchsatz-Rezept aus der
      # DGX-Spark-Arena (spark-arena.com) fuer nvidia/Qwen3.6-35B-A3B-NVFP4,
      # die Kombination mit der hoechsten Token-Rate auf dem GB10:
      #   --kv-cache-dtype fp8            halbiert den KV-Cache
      #   --attention-backend flashinfer  schnellster Attention-Kernel (GB10)
      #   --moe-backend marlin           NVFP4-MoE ueber den Marlin-Kernel
      #   --speculative-config mtp       Multi-Token-Prediction, 3 vorab
      #   --load-format fastsafetensors  schnelleres Laden der Shards
      #   --async-scheduling             Scheduler neben der GPU-Arbeit
      #   --enable-chunked-prefill       langer Prefill in Haeppchen
      #   --max-num-seqs / --max-num-batched-tokens   Batch-Fenster
      #   --enable-prefix-caching        spart den Prefill des ~6500-Token-
      #                                  System-Prompts in JEDER Runde
      # --reasoning-parser NICHT hier (siehe AIGAME_REASONING_PARSER), sonst
      # haengt der Code das Flag doppelt an.
      # Weigert sich vLLM zu starten ("unrecognized arguments"), kennt dieser
      # Build ein Flag nicht -> die betroffene Option streichen. Die Ursache
      # steht sofort in der Fehlermeldung des Spiels.
      AIGAME_VLLM_ARGS: >-
        --trust-remote-code --kv-cache-dtype fp8
        --attention-backend flashinfer --moe-backend marlin
        --max-num-seqs 4 --max-num-batched-tokens 32768
        --enable-chunked-prefill --async-scheduling --enable-prefix-caching
        --load-format fastsafetensors
        --speculative-config '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      # Reasoning-Parser von vLLM, passend zum Modell setzen (qwen3,
      # deepseek_r1, ...). Leer lassen, wenn ohne Thinking gefahren wird.
      #
      # Zwingend, sobald AIGAME_THINK=1 UND eine Grammatik aktiv ist: ohne
      # den Parser greift die Grammatik ab dem ersten Token, das Modell
      # muesste also sofort mit "{" beginnen - ein <think>-Block waere damit
      # unmoeglich und der Denkprozess verschwaende ersatzlos. Mit dem
      # Parser denkt es frei und wird erst nach </think> gezwungen.
      AIGAME_REASONING_PARSER: "qwen3"
      AIGAME_THINK: "1"
      # Fuer WELCHE Call-Typen der Denkprozess laeuft (nur wenn AIGAME_THINK=1).
      # Reasoning kostet ~2-4k Token/Call und dominiert die Rundenzeit. RESOLVE
      # und INIT brauchen es (Kollision, Scheitern, neue Raeume/Figuren).
      # NARRATE ist wieder drin: ohne Denken ERFINDET der Erzaehler Abschluesse,
      # die im Delta nicht stehen (Playtest "Schneesturm": "wirfst dich hinunter
      # in die Treppe", waehrend der Spieler laut State noch oben steht) - das
      # erzeugt Narration/State-Desync, den der naechste Resolver ausbaden muss.
      # DECIDE ist wieder drin: ohne Denken halluziniert eine aggressive Figur
      # eine komplette falsche Backstory ueber eine ANDERE Figur (Playtest
      # "Geschworener": Viktor erfand Elias' Tochter-OP, Versicherungsbetrug,
      # Versteck) - und die Erfindung wird ueber Zitat-Events zum Kanon und
      # verdraengt die Praemisse. Fuer maximales Tempo "".
      AIGAME_THINK_CALLS: "init,resolve,decide,narrate"
      # Antwortbudget fuer Calls OHNE Denkprozess (DECIDE/NARRATE) - ein Delta
      # bzw. Erzaehltext ist klein, 24k (AIGAME_MAX_TOKENS) waeren nur ein
      # Runaway-Netz, das es ohne Reasoning kaum braucht.
      AIGAME_NO_THINK_MAX_TOKENS: "2048"
      TERM: ${TERM:-xterm-256color}
      TERM_PROGRAM: ${TERM_PROGRAM:-}
      KITTY_WINDOW_ID: ${KITTY_WINDOW_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace/gameprototype
    # Nur noch warten - die Pakete bringt das Image schon mit (siehe build:
    # oben). Das Spiel selbst startet man per:
    #   docker exec -it -e TERM=$TERM gameprototype python3 main.py
    command: ["sleep", "infinity"]
    depends_on:
      - vllm          # nur gestartet, nicht 'healthy' - der Server wird erst vom Spiel beladen
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm:
    image: ghcr.io/timothystewart6/vllm-gb10:latest
    container_name: vllm
    ipc: host
    # PID 1 waere sonst 'sleep infinity' - und sleep erntet keine Waisen.
    # llm.VLLM._pkill() schiesst 'vllm serve' ab, dessen EngineCore-Worker
    # werden dann an PID 1 umgehaengt und bleiben mangels wait() fuer immer
    # als <defunct>/Z stehen (ein Slot-Leck pro Unload). 'init: true' schiebt
    # Dockers tini als PID 1 davor, das genau diese Waisen abraeumt.
    init: true
    volumes:
      # gleicher Cache wie das Spiel (ausserhalb des Repos): jedes gelistete
      # Modell ist servierbar, ohne dass vLLM es aus dem Netz zieht
      - /srv/ai/models/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # Arena-Rezept: schnellerer Pfad im Marlin-NVFP4-Kernel auf dem GB10.
      # 'docker exec' (llm.VLLM._serve) erbt die Container-Umgebung, das
      # 'vllm serve' sieht die Variable also.
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    # laeuft idle; llm.VLLM.load() startet 'vllm serve <modell>' per exec
    command: ["sleep", "infinity"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

